<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone match</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.9}
.tl-scroll{scrollbar-width:none}.tl-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{p.bg}}; color: {{p.text}}; font-family: Barlow, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 14px 10px">
    <a href="#" aria-label="Back" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: {{p.surface}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 600">KVA</span>
      <span style="width: 8px; height: 22px; border-radius: 3px; background: {{club}}"></span>
      <strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums">2 – 1</strong>
      <span style="width: 8px; height: 22px; border-radius: 3px; background: #2F9BFF"></span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 600">NOR</span>
    </div>
    <strong style="width: 40px; text-align: right; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 600">67’</strong>
  </header>

  <div style="margin: 0 12px; border-radius: 16px; overflow: hidden; background: radial-gradient(110% 90% at 50% 40%, {{p.stageGlow}} 0%, {{p.stage}} 70%); padding: 12px">
    <svg viewBox="0 0 1050 680" style="display: block; width: 100%; height: auto" role="img" aria-label="Pitch, Kvarnby pressing in Norrvik's half">
      <defs>
        <linearGradient id="pt" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="{{club}}" stop-opacity="0.55"></stop>
          <stop offset="0.66" stop-color="{{club}}" stop-opacity="0.45"></stop>
          <stop offset="0.74" stop-color="#2F9BFF" stop-opacity="0.45"></stop>
          <stop offset="1" stop-color="#2F9BFF" stop-opacity="0.55"></stop>
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="1050" height="680" rx="12" fill="url(#pt)"></rect>
      <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="5">
        <rect x="10" y="10" width="1030" height="660"></rect>
        <line x1="525" y1="10" x2="525" y2="670"></line>
        <circle cx="525" cy="340" r="91"></circle>
        <rect x="10" y="138" width="165" height="404"></rect>
        <rect x="875" y="138" width="165" height="404"></rect>
      </g>
      <circle cx="830" cy="232" r="16" fill="#ffffff"></circle>
    </svg>
  </div>

  <div style="display: flex; gap: 8px; padding: 10px 12px">
    <button style="flex: 1; min-height: 46px; border-radius: 12px; border: 0; background: {{p.text}}; color: {{p.bg}}; font: inherit; font-weight: 700">Pause</button>
    <button style="flex: 1; min-height: 46px; border-radius: 12px; border: 0; background: {{accent}}; color: {{p.onAccent}}; font: inherit; font-weight: 700">Changes</button>
    <button aria-label="Switch to 2D view" style="width: 46px; min-height: 46px; border-radius: 12px; border: 1px solid {{p.line}}; background: transparent; color: {{p.text}}; font: inherit; font-weight: 700; font-size: 13px">2D</button>
    <button aria-label="Speed, 3 times" style="width: 46px; min-height: 46px; border-radius: 12px; border: 1px solid {{p.line}}; background: transparent; color: {{p.text}}; font: inherit; font-weight: 700; font-size: 13px">3×</button>
  </div>

  <div role="tablist" style="display: flex; margin: 0 12px; border-bottom: 1px solid rgba(255,255,255,0.08)">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 12px 16px">
    <sc-if value="{{showStats}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{stats}}" as="s" hint-placeholder-count="5">
          <div style="display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums">
            <div style="display: flex; justify-content: space-between; font-size: 14px">
              <strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 600">{{s.a}}</strong>
              <span style="color: {{p.muted}}">{{s.label}}</span>
              <strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 600">{{s.b}}</strong>
            </div>
            <div style="display: flex; gap: 3px; height: 5px">
              <span style="width: {{s.wa}}; border-radius: 3px; background: {{club}}"></span>
              <span style="flex: 1; border-radius: 3px; background: #2F9BFF"></span>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{showFeed}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{feed}}" as="f" hint-placeholder-count="5">
          <div style="display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid {{p.line}}; font-size: 14px">
            <span style="width: 30px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; color: {{p.muted}}">{{f.t}}</span>
            <span style="width: 8px; height: 8px; margin-top: 6px; border-radius: 50%; flex: none; background: {{f.c}}"></span>
            <span style="{{f.style}}">{{f.text}}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{showLineups}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{lineup}}" as="l" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid {{p.line}}; font-size: 14px">
            <span style="width: 22px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; color: {{p.muted}}">{{l.no}}</span>
            <span style="flex: 1">{{l.name}}</span>
            <strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px; color: {{l.rc}}">{{l.rating}}</strong>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club":{"editor":"color","default":"#FF4B5C","options":["#FF4B5C","#F5C518","#22C47A","#A46BFF"]},"scheme":{"editor":"enum","options":["Midnight","Graphite","Light"],"default":"Midnight"},"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#4ADE80","#38BDF8","#FF5C7A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'Stats' }; }
  renderVals() {
    const SCHEMES = {
      'Midnight': { bg: '#0A0E17', side: '#0D1220', surface: '#121826', raise: '#1A2232', sunk: 'rgba(0,0,0,0.25)', text: '#E8EDF7', soft: '#C3CBDB', muted: '#96A0B5', line: 'rgba(200,215,255,0.12)', glow: '#1D3159', stage: '#121826', stageGlow: '#1D3159', good: '#6EE7A8', bad: '#FF8FA0', info: '#7FBFFF', warn: '#F5C518', onAccent: '#0A0E17' },
      'Graphite': { bg: '#0E0F11', side: '#121316', surface: '#17191C', raise: '#1F2226', sunk: 'rgba(0,0,0,0.25)', text: '#EDEEF0', soft: '#C7CAD0', muted: '#9A9EA6', line: 'rgba(255,255,255,0.1)', glow: '#30343B', stage: '#17191C', stageGlow: '#30343B', good: '#6EE7A8', bad: '#FF8FA0', info: '#7FBFFF', warn: '#F5C518', onAccent: '#0A0E17' },
      'Light': { bg: '#F3F5F9', side: '#FFFFFF', surface: '#FFFFFF', raise: '#EEF1F6', sunk: 'rgba(15,20,32,0.05)', text: '#0F1420', soft: '#36405A', muted: '#5A6478', line: 'rgba(15,20,32,0.12)', glow: '#E4ECFB', stage: '#141B2B', stageGlow: '#22365E', good: '#0E8A4F', bad: '#C2283D', info: '#1F6FD1', warn: '#9A6B00', onAccent: '#0A0E17' }
    };
    const p = SCHEMES[this.props.scheme ?? 'Midnight'] || SCHEMES['Midnight'];
    const accent = this.props.accent ?? '#FFB547';

    const club = this.props.club ?? '#FF4B5C';
    const tab = this.state.tab;
    const tabs = ['Stats', 'Feed', 'Lineups'].map(label => ({
      label, selected: tab === label ? 'true' : 'false', pick: () => this.setState({ tab: label }),
      style: 'flex: 1; min-height: 46px; border: 0; background: transparent; font: inherit; font-weight: 600; font-size: 14px; ' + (tab === label ? 'color: ' + p.text + '; box-shadow: inset 0 -2px 0 ' + club : 'color: ' + p.muted)
    }));
    const raw = [['Possession', 54, 46, '%'], ['Field tilt', 63, 37, '%'], ['Shots', 11, 7, ''], ['xG', 1.64, 0.91, ''], ['Pass accuracy', 84, 78, '%'], ['Corners', 6, 2, '']];
    const stats = raw.map(([label, a, b, u]) => ({ label, a: a + u, b: b + u, wa: Math.round(a / (a + b) * 100) + '%' }));
    const ev = [['67’', 'Berg shoots wide after a high win', club, false], ['61’', 'Goal! Mäkelä on the break, 2–1', club, true], ['48’', 'Goal for Norrvik, Lund heads in', '#2F9BFF', true], ['HT', '1–0 at the break', p.muted, false], ['23’', 'Goal! Berg from the edge, 1–0', club, true]];
    const feed = ev.map(([t, text, c, big]) => ({ t, text, c, style: big ? 'font-weight: 600' : 'color: ' + p.soft }));
    const lu = [[1, 'Ek', 7.0], [2, 'Strand', 6.8], [5, 'Nyberg', 7.2], [3, 'Duarte', 7.1], [7, 'Mäkelä', 8.1], [6, 'Sjöö', 7.0], [9, 'Berg', 7.8], [10, 'Holm', 6.7]];
    const lineup = lu.map(([no, name, r]) => ({ no, name, rating: r.toFixed(1), rc: r >= 7.5 ? p.good : r < 6.7 ? p.bad : p.text }));
    return { p, accent, club, tabs, stats, feed, lineup, showStats: tab === 'Stats', showFeed: tab === 'Feed', showLineups: tab === 'Lineups' };
  }
}
</script>
</body>
</html>
