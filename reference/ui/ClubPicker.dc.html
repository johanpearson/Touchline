<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick your club</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.92}
summary{cursor:pointer}
.tl-scroll{scrollbar-width:none;scroll-snap-type:x proximity}.tl-scroll::-webkit-scrollbar{display:none}.tl-scroll > *{scroll-snap-align:start}
</style>
</helmet>
<div style="min-height: 800px; background: radial-gradient(90% 70% at 30% 35%, {{glow}} 0%, {{p.bg}} 62%); color: {{p.text}}; font-family: Barlow, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; transition: background 0.4s">
  <header style="display: flex; align-items: center; gap: 14px; padding: 22px 40px">
    <a href="LeaguePicker.dc.html" aria-label="Back to league" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid {{p.line}}; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 13px; color: {{p.muted}}">New career, step 2 of 2</span>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 600; line-height: 1.05">Pick your club</h1>
    </div>
    <a href="LeaguePicker.dc.html" style="margin-left: 18px; display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid {{p.line}}; font-size: 13px; color: {{p.muted}}">League: <strong style="color: {{p.text}}; font-weight: 600">First Division</strong></a>
    <span style="margin-left: auto; font-size: 14px; color: {{p.muted}}; font-variant-numeric: tabular-nums">{{position}}</span>
  </header>

  <main style="flex: 1; width: 100%; max-width: 1200px; box-sizing: border-box; margin: 0 auto; padding: 8px 40px 28px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; gap: 18px">
      <button onClick="{{prev}}" aria-label="Previous club" style="width: 52px; height: 52px; flex: none; border-radius: 50%; border: 1px solid {{p.line}}; background: {{p.surface}}; color: {{p.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>

      <section aria-label="Selected club" style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 36px; align-items: center; padding: 30px 34px; border-radius: 26px; background: {{p.surface}}; border: 1px solid {{p.line}}">
        <svg width="190" height="220" viewBox="0 0 190 220" role="img" aria-label="{{crestLabel}}" style="flex: none">
          <defs><clipPath id="sh"><path d="M95 6 L180 34 V108 C180 160 140 196 95 214 C50 196 10 160 10 108 V34 Z"></path></clipPath></defs>
          <g clip-path="url(#sh)">
            <rect x="0" y="0" width="190" height="220" fill="{{c.primary}}"></rect>
            <rect x="95" y="0" width="95" height="220" fill="{{c.secondary}}"></rect>
            <rect x="0" y="92" width="190" height="40" fill="{{c.primary}}"></rect>
          </g>
          <path d="M95 6 L180 34 V108 C180 160 140 196 95 214 C50 196 10 160 10 108 V34 Z" fill="none" stroke="{{p.text}}" stroke-opacity="0.85" stroke-width="5"></path>
          <text x="95" y="122" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="34" fill="{{c.ink}}">{{c.short}}</text>
        </svg>

        <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <span style="display: inline-flex; align-self: flex-start; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: {{c.diffBg}}; color: {{c.diffInk}}">{{c.difficulty}}</span>
            <h2 style="margin: 4px 0 0; font-family: 'Barlow Condensed', sans-serif; font-size: 56px; font-weight: 700; line-height: 1">{{c.name}}</h2>
            <span style="color: {{p.muted}}">{{c.expect}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
            <sc-for list="{{c.lines}}" as="l" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="display: flex; justify-content: space-between; font-size: 13px"><span style="color: {{p.muted}}">{{l.label}}</span><strong style="font-variant-numeric: tabular-nums">{{l.v}}</strong></div>
                <span style="height: 6px; border-radius: 3px; background: {{p.track}}; overflow: hidden"><span style="display: block; height: 100%; width: {{l.w}}; background: {{accent}}"></span></span>
              </div>
            </sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
            <div style="padding: 12px 14px; border-radius: 14px; background: {{p.surface2}}"><span style="font-size: 12px; color: {{p.muted}}">Rating</span><div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 600">{{c.rating}}</div></div>
            <div style="padding: 12px 14px; border-radius: 14px; background: {{p.surface2}}"><span style="font-size: 12px; color: {{p.muted}}">Transfer budget</span><div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 600">{{c.budget}}</div></div>
            <div style="padding: 12px 14px; border-radius: 14px; background: {{p.surface2}}"><span style="font-size: 12px; color: {{p.muted}}">Star player</span><div style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 600; line-height: 1.25">{{c.star}}</div></div>
          </div>
          <div style="display: flex; align-items: center; gap: 22px">
            <span style="font-size: 13px; color: {{p.muted}}">Kits</span>
            <sc-for list="{{c.kits}}" as="kit" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 10px">
                <svg width="44" height="44" viewBox="0 0 80 80" role="img" aria-label="{{kit.label}}"><path d="M28 8 L16 14 L4 28 L14 38 L20 33 V74 H60 V33 L66 38 L76 28 L64 14 L52 8 C49 15 31 15 28 8 Z" fill="{{kit.body}}" stroke="{{kit.trim}}" stroke-width="3" stroke-linejoin="round"></path><path d="M20 33 V74 H60 V33" fill="none" stroke="{{kit.trim}}" stroke-width="0"></path><rect x="36" y="16" width="8" height="58" fill="{{kit.trim}}"></rect></svg>
                <span style="display: flex; flex-direction: column"><strong style="font-size: 14px; font-weight: 600">{{kit.name}}</strong><span style="font-size: 12px; color: {{p.muted}}">{{kit.note}}</span></span>
              </div>
            </sc-for>
          </div>
        </div>
      </section>

      <button onClick="{{next}}" aria-label="Next club" style="width: 52px; height: 52px; flex: none; border-radius: 50%; border: 1px solid {{p.line}}; background: {{p.surface}}; color: {{p.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>

    <div role="listbox" aria-label="All clubs" class="tl-scroll" style="display: flex; gap: 8px; overflow-x: auto; padding: 2px; -webkit-mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 80px), transparent 100%); mask-image: linear-gradient(90deg, #000 0, #000 calc(100% - 80px), transparent 100%)">
      <sc-for list="{{clubs}}" as="k" hint-placeholder-count="14">
        <button role="option" aria-selected="{{k.selected}}" onClick="{{k.pick}}" style="{{k.style}}">
          <span style="width: 26px; height: 26px; border-radius: 50%; flex: none; background: {{k.kit}}; box-shadow: 0 0 0 1px rgba(255,255,255,0.25)"></span>
          <span style="display: flex; flex-direction: column; align-items: flex-start; min-width: 0">
            <span style="font-weight: 600; font-size: 13px; white-space: nowrap">{{k.name}}</span>
            <span style="font-size: 12px; opacity: 0.75">{{k.rating}}</span>
          </span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <details style="color: {{p.muted}}; font-size: 14px">
        <summary>Advanced: league seed</summary>
        <label style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
          <span>Seed</span>
          <input value="243216349" style="min-height: 40px; width: 150px; padding: 0 10px; border-radius: 10px; border: 1px solid {{p.line}}; background: {{p.surface}}; color: {{p.text}}; font: inherit">
        </label>
      </details>
      <a href="#" style="margin-left: auto; display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 14px; background: {{accent}}; color: {{p.onAccent}}; font-weight: 700; font-size: 16px">
        Manage {{c.name}}
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;scheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Midnight&quot;,&quot;Graphite&quot;,&quot;Light&quot;],&quot;default&quot;:&quot;Midnight&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFB547&quot;,&quot;options&quot;:[&quot;#FFB547&quot;,&quot;#4ADE80&quot;,&quot;#38BDF8&quot;,&quot;#FF5C7A&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    const schemes = {
      'Midnight': { bg: '#0A0E17', surface: '#121826', surface2: '#1A2232', track: '#232C3F', text: '#E8EDF7', muted: '#96A0B5', line: 'rgba(200,215,255,0.12)' },
      'Night pitch': { bg: '#08110E', surface: '#101C17', surface2: '#16261F', track: '#1F3329', text: '#E6F2EC', muted: '#8FA79B', line: 'rgba(200,255,225,0.11)' },
      'Light': { bg: '#F3F5F9', surface: '#FFFFFF', surface2: '#EEF1F6', track: '#E1E6EE', text: '#0F1420', muted: '#5A6478', line: 'rgba(15,20,32,0.12)' },
      'Graphite': { bg: '#0E0F11', surface: '#17191C', surface2: '#1F2226', track: '#2A2E33', text: '#EDEEF0', muted: '#9A9EA6', line: 'rgba(255,255,255,0.1)' },
      'Plum': { bg: '#120C16', surface: '#1C1422', surface2: '#251B2D', track: '#2E2236', text: '#F4ECF3', muted: '#A996A8', line: 'rgba(255,255,255,0.09)' }
    };
    const p = Object.assign({}, schemes[this.props.scheme ?? 'Midnight'] || schemes['Midnight'], { onAccent: '#0A0E17' });
    const accent = this.props.accent ?? '#FFB547';
    const raw = [
      ['Isbro Town', '#9B2335', '#F2F2F2', 79, 'Lind'], ['Stenvik Park', '#3BB5A0', '#111111', 75, 'Okoye'], ['Rävsta Rovers', '#A3256E', '#F2F2F2', 72, 'Sundin'],
      ['Yxbo United', '#808A2E', '#111111', 71, 'Hamrin'], ['Ormberg City', '#8E6E2A', '#F2F2F2', 67, 'Bergqvist'], ['Granfors Town', '#3DB03D', '#111111', 62, 'Moreno'],
      ['Ulvsby Park', '#3A30D0', '#F2F2F2', 62, 'Ekström'], ['Mossen Park', '#3A8FC0', '#111111', 59, 'Virta'], ['Mölnbo', '#9A2AA8', '#F2F2F2', 55, 'Dahl'],
      ['Ängsvik Norra Rovers', '#1F3A8A', '#F2F2F2', 53, 'Kaya'], ['Sandvik Syd Town', '#C0522A', '#F2F2F2', 49, 'Löfgren'], ['Björkhamn Rovers', '#3CC46A', '#111111', 45, 'Andersson'],
      ['Tjärby Park', '#5C9E3A', '#111111', 40, 'Persson'], ['Jägarbo Athletic', '#7B2FC8', '#F2F2F2', 39, 'Nilsson']
    ];
    const n = raw.length, i = ((this.state.i % n) + n) % n;
    const [name, primary, secondary, rating, star] = raw[i];
    const off = (k) => ((name.length * (k + 3) * 7) % 9) - 4;
    const lines = [['Attack', rating + off(1)], ['Midfield', rating + off(2)], ['Defence', rating + off(3)]].map(([label, v]) => ({ label, v, w: Math.round((v - 30) / 60 * 100) + '%' }));
    const diff = rating >= 72 ? ['Easy', 'Title favourites. The board expects the championship.', '#1F5E3B', '#B7F5CF']
      : rating >= 60 ? ['Normal', 'Top half side. The board wants a push for the top four.', '#1E3A5F', '#BFDBFE']
      : rating >= 50 ? ['Hard', 'Lower mid-table. The board wants to stay well clear of the drop.', '#5C3B0B', '#FDE2B0']
      : ['Very hard', 'Relegation candidates. Survival would be a big success.', '#5E1B24', '#FECACA'];
    const short = name.split(' ').map(w => w[0]).join('').slice(0, 3).toUpperCase();
    const c = {
      name, primary, secondary, rating, short, star: star + ', ' + (rating > 60 ? 'ST' : 'CM'),
      ink: '#ffffff', difficulty: diff[0], expect: diff[1], diffBg: diff[2], diffInk: diff[3],
      budget: (rating * rating / 1200).toFixed(1) + ' m', lines,
      kits: [{ name: 'Home', note: 'Default', body: primary, trim: secondary, label: 'Home kit' }, { name: 'Away', note: 'Worn when colours clash', body: secondary, trim: primary, label: 'Away kit' }]
    };
    const clubs = raw.map(([nm, pr, se, rt], j) => ({
      name: nm, rating: 'Rating ' + rt, selected: j === i ? 'true' : 'false',
      kit: 'linear-gradient(90deg, ' + pr + ' 0 50%, ' + se + ' 50% 100%)',
      pick: () => this.setState({ i: j }),
      style: 'display: flex; align-items: center; gap: 10px; flex: none; min-height: 52px; padding: 0 14px 0 10px; border-radius: 14px; font: inherit; cursor: pointer; text-align: left; ' + (j === i ? 'background: ' + p.text + '; color: ' + p.bg + '; border: 1px solid ' + p.text : 'background: ' + p.surface + '; color: ' + p.text + '; border: 1px solid ' + p.line)
    }));
    return {
      p, accent, c, clubs, crestLabel: name + ' crest',
      glow: primary + '55', position: (i + 1) + ' of ' + n + ', sorted by rating',
      prev: () => this.setState({ i: i - 1 }), next: () => this.setState({ i: i + 1 })
    };
  }
}
</script>
</body>
</html>
