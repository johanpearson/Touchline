<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=Barlow:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{opacity:0.9}
.tl-scroll{scrollbar-width:none}.tl-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{p.bg}}; color: {{p.text}}; font-family: Barlow, system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 10px; padding: 18px 16px 10px">
    <div style="width: 36px; height: 36px; border-radius: 10px; background: {{club}}; color: #0A0E17; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center">KFF</div>
    <div style="display: flex; flex-direction: column">
      <strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 600; line-height: 1.1">Kvarnby FF</strong>
      <span style="font-size: 12px; color: {{p.muted}}">Round 12, two days to matchday</span>
    </div>
    <button aria-label="Search" style="margin-left: auto; width: 44px; height: 44px; border-radius: 12px; border: 0; background: {{p.surface}}; color: {{p.text}}; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    </button>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <section aria-label="Next match" style="border-radius: 20px; padding: 18px; background: radial-gradient(120% 140% at 15% 0%, {{p.glow}} 0%, {{p.surface}} 60%); border: 1px solid {{p.line}}; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; color: {{p.muted}}">Saturday 15:00 at Kvarnvallen</span>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 10px"><span style="width: 14px; height: 14px; border-radius: 4px; background: {{club}}"></span><strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; line-height: 1">Kvarnby FF</strong><span style="margin-left: auto; color: {{p.muted}}; font-size: 13px">3rd</span></div>
        <div style="display: flex; align-items: center; gap: 10px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #2F9BFF"></span><strong style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 600; line-height: 1">Norrvik IF</strong><span style="margin-left: auto; color: {{p.muted}}; font-size: 13px">6th</span></div>
      </div>
      <a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 12px; background: {{p.text}}; color: {{p.bg}}; font-weight: 700">Prepare tactics</a>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="padding: 14px; border-radius: 16px; background: {{p.surface}}"><span style="font-size: 12px; color: {{p.muted}}">League</span><div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 600">3rd</div><span style="font-size: 12px; color: {{p.muted}}">23 pts, 4 behind 1st</span></div>
      <div style="padding: 14px; border-radius: 16px; background: {{p.surface}}"><span style="font-size: 12px; color: {{p.muted}}">Squad</span><div style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 600">91%</div><span style="font-size: 12px; color: {{p.bad}}">1 injured, 1 suspended</span></div>
    </div>

    <section aria-label="Inbox" style="border-radius: 16px; background: {{p.surface}}; padding: 6px 16px">
      <sc-for list="{{inbox}}" as="m" hint-placeholder-count="3">
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid {{p.line}}">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: {{club}}; flex: none"></span>
          <span style="display: flex; flex-direction: column; min-width: 0">
            <strong style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.title}}</strong>
            <span style="font-size: 12px; color: {{p.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.sub}}</span>
          </span>
        </a>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 6px 6px 18px; background: {{p.side}}; border-top: 1px solid {{p.line}}">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="#" style="{{t.style}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        <span style="font-size: 11px; font-weight: 600">{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club":{"editor":"color","default":"#FF4B5C","options":["#FF4B5C","#F5C518","#22C47A","#A46BFF"]},"scheme":{"editor":"enum","options":["Midnight","Graphite","Light"],"default":"Midnight"},"accent":{"editor":"color","default":"#FFB547","options":["#FFB547","#4ADE80","#38BDF8","#FF5C7A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const SCHEMES = {
      'Midnight': { bg: '#0A0E17', side: '#0D1220', surface: '#121826', raise: '#1A2232', sunk: 'rgba(0,0,0,0.25)', text: '#E8EDF7', soft: '#C3CBDB', muted: '#96A0B5', line: 'rgba(200,215,255,0.12)', glow: '#1D3159', stage: '#121826', stageGlow: '#1D3159', good: '#6EE7A8', bad: '#FF8FA0', info: '#7FBFFF', warn: '#F5C518', onAccent: '#0A0E17' },
      'Graphite': { bg: '#0E0F11', side: '#121316', surface: '#17191C', raise: '#1F2226', sunk: 'rgba(0,0,0,0.25)', text: '#EDEEF0', soft: '#C7CAD0', muted: '#9A9EA6', line: 'rgba(255,255,255,0.1)', glow: '#30343B', stage: '#17191C', stageGlow: '#30343B', good: '#6EE7A8', bad: '#FF8FA0', info: '#7FBFFF', warn: '#F5C518', onAccent: '#0A0E17' },
      'Light': { bg: '#F3F5F9', side: '#FFFFFF', surface: '#FFFFFF', raise: '#EEF1F6', sunk: 'rgba(15,20,32,0.05)', text: '#0F1420', soft: '#36405A', muted: '#5A6478', line: 'rgba(15,20,32,0.12)', glow: '#E4ECFB', stage: '#141B2B', stageGlow: '#22365E', good: '#0E8A4F', bad: '#C2283D', info: '#1F6FD1', warn: '#9A6B00', onAccent: '#0A0E17' }
    };
    const p = SCHEMES[this.props.scheme ?? 'Midnight'] || SCHEMES['Midnight'];
    const accent = this.props.accent ?? '#FFB547';

    const club = this.props.club ?? '#FF4B5C';
    const items = [
      ['Home', 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],
      ['Squad', 'M16 19v-1a4 4 0 0 0-8 0v1M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6'],
      ['Match', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7l3 2-1 4h-4l-1-4z'],
      ['League', 'M5 6h14M5 12h14M5 18h14'],
      ['More', 'M5 12h.01M12 12h.01M19 12h.01']
    ];
    const tabs = items.map(([label, icon], i) => ({
      label, icon,
      style: 'min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border-radius: 12px; ' + (i === 0 ? 'color: ' + club : 'color: ' + p.muted)
    }));
    return { p, accent,
      club, tabs,
      inbox: [{ title: 'Board: top three is the target', sub: 'You are on track, 1 point above the line' }, { title: 'Scout report: Norrvik IF', sub: 'Dangerous on the counter, weak in the air' }, { title: 'Offer for Sjöö from Hallbro FK', sub: 'They bid 1.4 m, deadline Friday' }]
    };
  }
}
</script>
</body>
</html>
