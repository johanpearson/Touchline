name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The full balance suite runs as parallel groups (#219), the same groups as the PR `Balance` job (scripts/balance-groups.mjs).
  # Keep the group list below the same as BALANCE_GROUPS there (balance-groups.test.ts checks it). Each shard uploads its log and
  # outcome; `balance-full` joins them (merge reads `balance-shard-<group>` folders), so the status, the badge and the failure issue still see one `balance` result.
  balance-shard:
    name: Balance ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [game, tactics-attacking, tactics-balanced, tactics-defensive]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Balance group
        run: |
          set -o pipefail
          mkdir -p shard
          FORCE_COLOR=0 npm run test:balance:group -- ${{ matrix.group }} 2>&1 | tee shard/balance.log
      - name: Write the outcome
        if: always()
        run: echo "${{ job.status }}" > shard/outcome.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: balance-shard-${{ matrix.group }}
          path: shard
          if-no-files-found: ignore

  balance-full:
    name: Balance (full)
    needs: balance-shard
    # Runs even when a shard failed, so the result and the issue are written.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: balance-shard-*
          path: shards
      - name: Join the shard logs
        id: join
        run: node scripts/balance-groups.mjs merge --in shards --out balance.log
      - name: Open an issue for the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_GROUPS: ${{ steps.join.outputs.failed_groups }}
        run: bash scripts/nightly-balance-issue.sh balance.log
      - name: Write the result
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/nightly-status.mjs result --job balance --outcome ${{ job.status }} --log balance.log --out result-balance.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-result-balance
          path: result-balance.json

  # The mutation run is split into parallel shards (#209): the whole nightly run has to finish in two hours at most, aiming for
  # one. `scripts/mutation-shards.mjs` spreads the mutated files over the shards by size, so a new engine file joins a shard by
  # itself. Keep the shard list below, `--shards` in the merge job and `shards` in scripts/nightly-workflow.test.ts the same.
  mutation-shard:
    name: Mutation shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stryker
        run: |
          set -o pipefail
          start=$SECONDS
          files=$(node scripts/mutation-shards.mjs --shard ${{ matrix.shard }} --of ${{ strategy.job-total }})
          echo "Mutating: $files"
          status=0
          FORCE_COLOR=0 npx stryker run stryker.shard.config.json --mutate "$files" 2>&1 | tee mutation.log || status=$?
          mkdir -p reports/mutation
          echo "{\"seconds\": $((SECONDS - start))}" > reports/mutation/meta.json
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation
          if-no-files-found: ignore

  mutation:
    name: Mutation testing (engine)
    needs: mutation-shard
    # Runs even when a shard failed or timed out: the merge names the shard without a report and the badge goes red.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: mutation-shard-*
          path: shards
      - name: Merge the shard reports
        run: |
          mkdir -p shards
          node scripts/merge-mutation-reports.mjs --in shards --shards 8 --out mutation.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: mutation.log
          if-no-files-found: ignore
      - name: Write the result
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/nightly-status.mjs result --job mutation --outcome ${{ job.status }} --log mutation.log --out result-mutation.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-result-mutation
          path: result-mutation.json

  property-tests:
    name: Property tests (engine, many runs)
    runs-on: ubuntu-latest
    env:
      FC_RUNS: "500"
      # A fresh set of inputs each night; a failure prints the seed, reproduce it with FC_SEED.
      FC_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/engine/action/action-match.property.test.ts
      - name: Write the result
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/nightly-status.mjs result --job property --outcome ${{ job.status }} --out result-property.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-result-property
          path: result-property.json

  e2e-full:
    name: E2E full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright
        run: |
          if [ "$(npm pkg get scripts.test:e2e)" != "{}" ]; then
            npx playwright install --with-deps
            npm run test:e2e
          else
            echo "::notice::no E2E tests yet"
          fi
      - name: Write the result
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/nightly-status.mjs result --job e2e --outcome ${{ job.status }} --out result-e2e.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-result-e2e
          path: result-e2e.json

  publish-status:
    name: Publish nightly status
    needs: [balance-full, mutation, property-tests, e2e-full]
    # Runs even when a nightly job failed, so a red job shows up as a red badge.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: nightly-result-*
          path: results
          merge-multiple: true
      - name: Build status.json and the badges
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p results
          node scripts/nightly-status.mjs publish --in results --out site
          cat site/status.json
      - name: Publish to the nightly-status branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish-nightly-status.sh site
