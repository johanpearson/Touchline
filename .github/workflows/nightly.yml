name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation testing (engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stryker
        run: |
          if [ "$(npm pkg get scripts.test:mutation)" != "{}" ]; then npm run test:mutation; else echo "::notice::mutation testing not set up yet"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore

  e2e-full:
    name: E2E full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright
        run: |
          if [ "$(npm pkg get scripts.test:e2e)" != "{}" ]; then
            npx playwright install --with-deps
            npm run test:e2e
          else
            echo "::notice::no E2E tests yet"
          fi
