name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance-full:
    name: Balance (full)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full balance suite
        run: |
          set -o pipefail
          FORCE_COLOR=0 npm run test:balance 2>&1 | tee balance.log
      - name: Open an issue for the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/nightly-balance-issue.sh balance.log

  mutation:
    name: Mutation testing (engine)
    runs-on: ubuntu-latest
    # The action engine alone takes about two hours on four cores.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stryker
        run: |
          if [ "$(npm pkg get scripts.test:mutation)" != "{}" ]; then npm run test:mutation; else echo "::notice::mutation testing not set up yet"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore

  property-tests:
    name: Property tests (engine, many runs)
    runs-on: ubuntu-latest
    env:
      FC_RUNS: "500"
      # A fresh set of inputs each night; a failure prints the seed, reproduce it with FC_SEED.
      FC_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/engine/action/action-match.property.test.ts

  e2e-full:
    name: E2E full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Playwright
        run: |
          if [ "$(npm pkg get scripts.test:e2e)" != "{}" ]; then
            npx playwright install --with-deps
            npm run test:e2e
          else
            echo "::notice::no E2E tests yet"
          fi
