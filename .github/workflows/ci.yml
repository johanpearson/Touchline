name: CI

on:
  pull_request:
    # labeled/unlabeled re-run the checks so the `full-balance` label takes effect.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Module boundaries
        run: |
          if [ "$(npm pkg get scripts.depcheck)" != "{}" ]; then npm run depcheck; else echo "::notice::depcheck not set up yet"; fi
      - name: Unit tests with coverage
        run: |
          if [ "$(npm pkg get scripts.test:coverage)" != "{}" ]; then npm run test:coverage; else npm test; fi
      - name: Performance budget (runs alone, not in parallel with other tests)
        run: npm run test:perf
      - run: npm run build

  balance:
    name: Balance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Choose the balance suite
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # Fast subset by default. The full suite (all 81 tactic combinations) runs when the
          # PR has the `full-balance` label or changes the engine or any balance test.
          # The full suite also runs every night (nightly.yml).
          full=false
          if [ "$EVENT" = "pull_request" ]; then
            case ",$LABELS," in *,full-balance,*) full=true; echo "Label full-balance set." ;; esac
            if git diff --name-only "origin/$BASE_REF...HEAD" | grep -E '^src/engine/|\.balance\.test\.ts$|^vitest\.balance\.config\.ts$'; then
              full=true
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full balance suite: $full"
      - name: Engine balance tests (fast)
        if: steps.scope.outputs.full != 'true'
        run: npm run test:balance:fast
      - name: Engine balance tests (full)
        if: steps.scope.outputs.full == 'true'
        run: npm run test:balance

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:smoke
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
