name: Visual baselines

# The full visual run and the baselines (e2e/visual/__screenshots__), part of the nightly workflow (#351). It runs every
# story and screen state on the CI Linux runner, rewrites only the baselines that no longer match within the tolerance,
# checks that a second run is identical, and opens (or updates) one pull request `bot/visual-baselines` with auto-merge.
# PRs only run a small smoke set against these baselines (job `Visual` in ci.yml), never need baseline commits, and a
# merged baseline pull request starts nothing. A broken screen state, or baselines that are not stable between two runs,
# fails this job: the nightly status badge goes red and one issue is opened.
#
# Run it by hand from the Actions tab for fresh baselines now; `rebuild_all` deletes every baseline first and renders
# them all again (this also removes the baselines of deleted states).
#
# Needs the repository secrets APP_ID and APP_PRIVATE_KEY of a GitHub App with contents and pull requests write
# access. A pull request opened with the default GITHUB_TOKEN does not start CI, so auto-merge would wait for
# ever; see docs/architecture.md, "Visual baselines".
on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Delete every baseline first and render them all again (also removes baselines of deleted states)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      rebuild_all:
        type: boolean
        default: false
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

concurrency:
  group: visual-baselines
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  baselines:
    name: Visual (full)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      BRANCH: bot/visual-baselines
      REBUILD_ALL: ${{ inputs.rebuild_all }}
    steps:
      - name: Check that the GitHub App is configured
        id: token
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::warning::Secrets APP_ID and APP_PRIVATE_KEY are not set, so the visual baselines were not updated. Create the GitHub App described in docs/architecture.md (Visual baselines)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create a GitHub App token
        id: app
        if: steps.token.outputs.ready == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        if: steps.token.outputs.ready == 'true'
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@v7
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.ready == 'true'
        run: npm ci
      - if: steps.token.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.token.outputs.ready == 'true'
        run: npx storybook build --quiet
      - if: steps.token.outputs.ready == 'true'
        run: npx vite build
      - name: Regenerate the baselines
        if: steps.token.outputs.ready == 'true'
        run: |
          set -o pipefail
          # Only a baseline that no longer matches within the tolerance is rewritten. Deleting them all first
          # would turn harmless antialiasing noise into a changed PNG on every run, and so into a new pull request.
          if [ "$REBUILD_ALL" = "true" ]; then
            rm -rf e2e/visual/__screenshots__
          fi
          FORCE_COLOR=0 npx playwright test -c playwright.visual.config.ts --update-snapshots=changed 2>&1 | tee visual.log
      - name: Check that a second run has no diffs
        if: steps.token.outputs.ready == 'true'
        run: |
          set -o pipefail
          FORCE_COLOR=0 npx playwright test -c playwright.visual.config.ts 2>&1 | tee -a visual.log
      - name: Open or update the baseline pull request
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
            # An open baseline PR is now obsolete (for example after another one merged), so close it.
            gh pr close "$BRANCH" --delete-branch \
              --comment "Superseded: the baselines on main are already up to date." || true
            exit 0
          fi
          git checkout -B "$BRANCH"
          git commit -m "test(ui): update visual snapshots"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$BRANCH" --base main \
              --title "test(ui): update visual snapshots" \
              --body "Baselines regenerated on the CI runner after a change to the UI. Opened by the \`Visual baselines\` workflow; review the image diffs if you like, otherwise it merges itself."
          fi
          gh pr merge "$BRANCH" --auto --squash
      - name: Open an issue for the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/nightly-visual-issue.sh visual.log
      - name: Write the result
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/nightly-status.mjs result --job visual --outcome ${{ job.status }} --out result-visual.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-result-visual
          path: result-visual.json
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-baselines-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
